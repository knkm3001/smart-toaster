version: '3'

services:
  api-server:
    build:
      context: api-server
    depends_on:
      - redis
    volumes:
      - "/sys:/sys"
      - "./api-server/src:/app/src"
    devices:
      - "/dev/gpiomem:/dev/gpiomem"
    privileged: true
    environment:
      - REDIS_HOSTS=redis
      - REDIS_PORT=6379
      - KP=10.0
      - KI=0.1
      - KD=18.0
      - DT=1.0
      - MV_THRESHOLD=1000.0
    ports:
      - "5000:5000"

  redis:
    image: redis:latest
    ports:
      - "6379:6379"

  commander:
    image: ghcr.io/joeferner/redis-commander:latest
    depends_on:
      - redis
    environment:
    - REDIS_HOSTS=local:redis:6379
    ports:
      - 8081:8081
